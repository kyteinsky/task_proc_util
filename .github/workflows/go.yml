name: Go supervisor

on: pull_request

permissions:
  contents: read

concurrency:
  group: go-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    # Nextcloud-org repos should use `ubuntu-latest-low` here: that label resolves
    # to the org's own runner group, which this repository has no access to.
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read

    outputs:
      src: ${{ steps.changes.outputs.src }}

    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        continue-on-error: true
        with:
          filters: |
            src:
              - '.github/workflows/go.yml'
              - 'supervisor/**'

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.src != 'false'

    strategy:
      matrix:
        # Must be >= the `go` directive in supervisor/go.mod.
        go-version: ['1.25', 'stable']

    name: Go ${{ matrix.go-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: Vet
        run: cd supervisor && go vet ./...

      - name: Test
        run: cd supervisor && go test ./...

      # All three DB drivers (MySQL, PostgreSQL, modernc SQLite) are pure Go,
      # so CGO_ENABLED=0 cross-compilation works without a C toolchain.
      - name: Build (host arch)
        run: cd supervisor && CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" ./cmd/supervisor

      - name: Cross-compile (linux/arm64)
        run: cd supervisor && CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "-s -w" ./cmd/supervisor

      - name: Cross-compile (linux/arm)
        run: cd supervisor && CGO_ENABLED=0 GOOS=linux GOARCH=arm go build -trimpath -ldflags "-s -w" ./cmd/supervisor

  summary:
    permissions:
      contents: none
    runs-on: ubuntu-slim
    needs: [changes, test]

    if: always()

    name: go

    steps:
      - name: Summary status
        run: if ${{ needs.changes.outputs.src != 'false' && needs.test.result != 'success' }}; then exit 1; fi
